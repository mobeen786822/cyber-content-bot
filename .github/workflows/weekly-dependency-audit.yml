name: Weekly dependency audit
'on':
  schedule:
  - cron: 23 3 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
        - client
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Audit locked dependencies without installing project code
      run: npm audit --package-lock-only --ignore-scripts --audit-level=high
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        requirements:
        - requirements.txt
    env:
      PIP_ONLY_BINARY: ':all:'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install pinned audit tool from wheels
      run: python -m pip install pip-audit==2.10.1
    - name: Audit requirements (fail on findings or resolution failure)
      env:
        REQUIREMENTS_FILE: ${{ matrix.requirements }}
      run: pip-audit --strict --progress-spinner off --requirement "$REQUIREMENTS_FILE"
